substitutions:
  name: esp32ct-revc
  friendly_name: ESP32CT revC

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  name_add_mac_suffix: false
  project:
    name: p1reader.slimmelezer-component
    version: "1.0"
    #

esp32:
  board: mhetesp32minikit
  framework:
    type: arduino

## Enable/Disable logging
logger:
  level: INFO  # Don't use DEBUG in production
  logs:
    # Reduce verbosity for components that might log sensitive data
    wifi: WARN
    api: WARN
    modbus_controller.sensor: WARN
    modbus_controller.output: WARN
    modbus.number: WARN
    esp32.preferences: WARN
    sensor: WARN
    text_sensor: WARN
    button: WARN
    number: WARN
    component: WARN
    ble_client: WARN
    cd74hc4067: WARN
    ct_clamp: WARN
    dsmr: WARN

# Enable Home Assistant API
api:
  encryption:
    key: !secret esp32ct_api_encryption
  actions:
    - action: meterstand_water
      variables:
        meter_value: float
      then:
        - globals.set:
            id: initial_water_usage
            value: !lambda "return ( meter_value * atof(id(Select_pulse_water).current_option().c_str()) ) ;"
        - globals.set:
            id: total_water_pulses
            value:  "0"
        - globals.set:
            id: water_m3_geteld
            value:  "0"

ota:
  - platform: esphome
  - platform: web_server

wifi:
  ssid: !secret wifi_iot_ssid
  password: !secret wifi_iot_password
  reboot_timeout: 0s
  fast_connect: true
  power_save_mode: high
  min_auth_mode: WPA2
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fallback ${name}"
    password: !secret fallback_password
    ap_timeout: 15s

captive_portal:
  id: id_captive_portal

# Enable Web server.
web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: grp_p1
      name: "P1 / Slimme meter"
      sorting_weight: 10
    - id: grp_gas
      name: "Gas"
      sorting_weight: 20
    - id: grp_water
      name: "Watermeter"
      sorting_weight: 30
    - id: grp_doorbell
      name: "Deurbel"
      sorting_weight: 40
    - id: grp_mux1
      name: "Mux 1 - groepen (ch 1-16)"
      sorting_weight: 50

# Sync time with Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

# Text sensors with general information.
text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: ${name} ESPHome Version
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: ${name} IP
    ssid:
      name: ${name} SSID
    bssid:
      name: ${name} BSSID

  - platform: dsmr
    electricity_tariff:
      name: "Electricity Tariff"
      web_server:
        sorting_group_id: grp_p1
      filters:
        - map:
          - 0001 -> Low
          - 0002 -> Normal
    identification:
      name: "DSMR Identification"
      web_server:
        sorting_group_id: grp_p1
    p1_version:
      name: "DSMR Version"
      web_server:
        sorting_group_id: grp_p1

# Create a button to restart the unit from HomeAssistant. Rarely needed, but can be handy.
button:
  - platform: restart
    name: "Restart ${friendly_name}"

  - platform: template
    name: "Reset kWh Totals"
    icon: mdi:restart
    on_press:
      then:
        - lambda: id(tde_laadpaal).publish_state_and_save(0);

cd74hc4067:
  - id: cd74hc4067_shared
    delay: 2ms
    pin_s0:
      number: GPIO13
    pin_s1:
      number: GPIO4    # rev C: was GPIO12 (strapping pin)
    pin_s2:
      number: GPIO14
    pin_s3:
      number: GPIO27

uart:
  - rx_pin: GPIO18
    baud_rate: 115200
    rx_buffer_size: 1700
    id: uart_bus
  # rev C: nagebootste P1-poort naar de laadpaal. Q4 inverteert al in hardware,
  # dus niet inverted. Het doorsturen van het telegram zit er nog niet in.
  - tx_pin: GPIO17
    baud_rate: 115200
    id: uart_p1out

dsmr:
  id: dsmr_instance
  uart_id: uart_bus
  max_telegram_length: 1700
  request_pin: GPIO23   # rev C: was GPIO19
  request_interval: 1s

#    buffer_size: 3072
#    protocol: ascii

globals:
  # P1-uitgang (nagebootste slimme meter): de velden zijn number-entities
  # (P1 Out ...). Hier alleen hulpwaarden; de kWh-sommen worden elke 10 min
  # in de number-entities opgeslagen, om het flash te sparen.
  - id: p1o_acc
    type: std::array<double, 4>
    restore_value: no
  - id: p1o_acc_init
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: p1o_acc_save
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: p1o_wasactief
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: house
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: garage
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: initial_water_usage
    type: float
    restore_value: yes
    initial_value: '0'
  - id: total_water_pulses
    type: int
    restore_value: yes
    initial_value: '0'
  # 08-09-2026: de meterstand liep op via total_water_pulses, en die wordt opgehoogd
  # door de binary_sensor op GPIO32 - gepold, zonder ontdendering. Elke glitch bij het
  # opstarten telde een liter mee; over juli t/m september liep dat op tot 33,858 m3
  # spookverbruik. Deze global telt hetzelfde water, maar via de pulse_meter met zijn
  # internal_filter van 50 ms. total_water_pulses blijft gewoon lopen zodat je de twee
  # naast elkaar kunt leggen.
  - id: water_m3_geteld
    type: float
    restore_value: yes
    initial_value: '0'
  # 14-09-2026: wat de debietgrens hieronder heeft weggegooid, in m3. Alleen om achteraf
  # te kunnen zien dat hij iets deed en hoeveel - telt nergens mee.
  - id: water_m3_genegeerd
    type: float
    restore_value: yes
    initial_value: '0'
#------------------------# SELECTIE/OPTIES #------------------------#

select:
  # water per m3 rate
  - platform: template
    name: "Water Pulse Rate per m3"
    web_server:
      sorting_group_id: grp_water
    id: Select_pulse_water
    optimistic: true
    options:
      - "0.0001"
      - "0.0005"
      - "0.001"
      - "0.01"
      - "0.1"
    initial_option: "0.001"
    restore_value: yes

#------------------------# SENSOR BLOCK #------------------------#
# Sensors with general information.
sensor:
  # Uptime sensor.
  - platform: uptime
    name: ${name} Uptime

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: ${name} WiFi Signal
    update_interval: 120s

#------------------------# P1 Meter #------------------------#
  - platform: dsmr
    energy_delivered_tariff1:
      id: p1_cons_dal
      name: "Consumption Dal"
      web_server:
        sorting_group_id: grp_p1
    energy_delivered_tariff2:
      id: p1_cons_normaal
      name: "Consumption Normaal"
      web_server:
        sorting_group_id: grp_p1
    energy_returned_tariff1:
      id: p1_prod_dal
      name: "Production Dal"
      web_server:
        sorting_group_id: grp_p1
    energy_returned_tariff2:
      id: p1_prod_normaal
      name: "Production Normaal"
      web_server:
        sorting_group_id: grp_p1
    power_delivered:
      name: "Consumption"
      web_server:
        sorting_group_id: grp_p1
      accuracy_decimals: 3
    power_returned:
      name: "Production"
      web_server:
        sorting_group_id: grp_p1
      accuracy_decimals: 3
    electricity_failures:
      name: "Electricity Failures"
      web_server:
        sorting_group_id: grp_p1
      icon: mdi:alert
    electricity_long_failures:
      name: "Long Electricity Failures"
      web_server:
        sorting_group_id: grp_p1
      icon: mdi:alert
    voltage_l1:
      id: p1_v_l1
      name: "Voltage L1"
      web_server:
        sorting_group_id: grp_p1
    voltage_l2:
      id: p1_v_l2
      name: "Voltage L2"
      web_server:
        sorting_group_id: grp_p1
    voltage_l3:
      id: p1_v_l3
      name: "Voltage L3"
      web_server:
        sorting_group_id: grp_p1
    current_l1:
      name: "Current L1"
      web_server:
        sorting_group_id: grp_p1
    current_l2:
      name: "Current L2"
      web_server:
        sorting_group_id: grp_p1
    current_l3:
      name: "Current L3"
      web_server:
        sorting_group_id: grp_p1
    power_delivered_l1:
      id: cons_l1
      name: "Consumption L1"
      web_server:
        sorting_group_id: grp_p1
      accuracy_decimals: 3
    power_delivered_l2:
      id: cons_l2
      name: "Consumption L2"
      web_server:
        sorting_group_id: grp_p1
      accuracy_decimals: 3
    power_delivered_l3:
      id: cons_l3
      name: "Consumption L3"
      web_server:
        sorting_group_id: grp_p1
      accuracy_decimals: 3
    power_returned_l1:
      id: prod_l1
      name: "Production L1"
      web_server:
        sorting_group_id: grp_p1
      accuracy_decimals: 3
    power_returned_l2:
      id: prod_l2
      name: "Production L2"
      web_server:
        sorting_group_id: grp_p1
      accuracy_decimals: 3
    power_returned_l3:
      id: prod_l3
      name: "Production L3"
      web_server:
        sorting_group_id: grp_p1
      accuracy_decimals: 3
    gas_delivered:
      name: "Gas Consumption"
      web_server:
        sorting_group_id: grp_gas
  - platform: template
    name: "Net Power Total"
    web_server:
      sorting_group_id: grp_p1
    id: netto_vermogen_totaal
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 1s
    lambda: |-
      float net_l1 = (id(prod_l1).state > id(cons_l1).state)
                      ? -id(prod_l1).state : id(cons_l1).state;
      float net_l2 = (id(prod_l2).state > id(cons_l2).state)
                      ? -id(prod_l2).state : id(cons_l2).state;
      float net_l3 = (id(prod_l3).state > id(cons_l3).state)
                      ? -id(prod_l3).state : id(cons_l3).state;
      return (net_l1 + net_l2 + net_l3) * 1000.0;

  # Dal + Normaal opgeteld. Met een dynamisch contract is het tariefonderscheid
  # betekenisloos, dus dit is het enige kWh-getal dat telt. De vier losse
  # tariefsensoren blijven bestaan voor de historie.
  - platform: template
    name: "Consumption Totaal"
    id: p1_cons_totaal
    web_server:
      sorting_group_id: grp_p1
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      float dal = id(p1_cons_dal).state;
      float normaal = id(p1_cons_normaal).state;
      if (std::isnan(dal) || std::isnan(normaal)) return NAN;
      return dal + normaal;

  - platform: template
    name: "Production Totaal"
    id: p1_prod_totaal
    web_server:
      sorting_group_id: grp_p1
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      float dal = id(p1_prod_dal).state;
      float normaal = id(p1_prod_normaal).state;
      if (std::isnan(dal) || std::isnan(normaal)) return NAN;
      return dal + normaal;

  - platform: uptime
    name: "SlimmeLezer Uptime"
  - platform: wifi_signal
    name: "SlimmeLezer Wi-Fi Signal"
    update_interval: 60s
#------------------------# Water Meter #------------------------#
# water meter pulses
  - platform: pulse_meter
    internal_filter_mode: "PULSE"
    internal_filter: 50ms
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      allow_other_uses: true
    id: watermeter_flow
    name: "Water Meter Flow"
    web_server:
      sorting_group_id: grp_water
    state_class: measurement
    device_class: volume_flow_rate
    unit_of_measurement: "L/min"
    accuracy_decimals: 1
    icon: "mdi:water-pump"
    filters:
      lambda: return x * atof(id(Select_pulse_water).current_option().c_str()) * 1000;

# water meter total
    total:
      id: sensor_pulse_meter_total
      name: "Water Meter Total"
      web_server:
        sorting_group_id: grp_water
      state_class: "total_increasing"
      device_class: water
      icon: mdi:water
      unit_of_measurement: "m³"
      accuracy_decimals: 3
      filters:
        - multiply: 0.001
      on_value:
        # Deze sensor begint bij elke herstart weer op nul. Daarom wordt hier alleen het
        # verschil sinds de vorige waarde opgeteld bij een global die wel bewaard blijft.
        #
        # 14-09-2026: niet optellen zolang het debiet boven de 30 L/min zit. Tussen 08-09
        # en 14-09 telde hij 3.674 L terwijl de meter 1.098 L liep. Het verschil zat in
        # twee klapperpieken: 09-09 12:20-12:30 (847 L) en 12-09 01:10-01:40 (1.825 L).
        # Daarin mat hij 5 minuten lang gemiddeld 90-190 L/min en tot 575 L/min, met
        # pulsen van 0,0 s - dat kan niet door een huisaansluiting. Echt verbruik kwam
        # die week nooit boven 13,2 L/min, met pulsen van 2-3 s aan en uit. Beide pieken
        # begonnen vlak na echt verbruik; vermoedelijk blijft de wijzer dan op de rand
        # van de sensor staan. Het internal_filter van 50 ms vangt dat niet, het klapperen
        # is trager. Het debiet komt van de vorige puls; aan het begin van een piek glipt
        # er dus hooguit een liter of twee doorheen.
        - lambda: |-
            static float vorige = NAN;
            const float GRENS_L_MIN = 30.0f;
            if (!isnan(vorige) && x >= vorige) {
              float debiet = id(watermeter_flow).state;
              if (!isnan(debiet) && debiet > GRENS_L_MIN) {
                id(water_m3_genegeerd) += (x - vorige);
              } else {
                id(water_m3_geteld) += (x - vorige);
              }
            }
            vorige = x;

# approximate water meter reading
  - platform: template
    id: watermeter_total
    name: "Water Meter Reading"
    web_server:
      sorting_group_id: grp_water
    state_class: "total_increasing"
    device_class: water
    icon: mdi:water
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    lambda: return id(initial_water_usage) + id(water_m3_geteld);

# water pulses - web interface only for debugging
  - platform: template
    id: watermeter_flow_totaal
    name: "Water Meter Flow Total"
    web_server:
      sorting_group_id: grp_water
    state_class: "total_increasing"
    accuracy_decimals: 0
    lambda: return id(total_water_pulses);
    internal: True

# 14-09-2026: wat de debietgrens van 30 L/min heeft weggegooid. Diagnostisch.
  - platform: template
    name: "Water Genegeerd (klapperen)"
    web_server:
      sorting_group_id: grp_water
    unit_of_measurement: "L"
    accuracy_decimals: 0
    icon: mdi:water-off
    entity_category: diagnostic
    state_class: "total_increasing"
    lambda: return id(water_m3_genegeerd) * 1000.0f;

# water meter total in liters
  - platform: template
    name: "Water Meter Total (L)"
    web_server:
      sorting_group_id: grp_water
    unit_of_measurement: "L"
    accuracy_decimals: 0
    icon: mdi:water
    lambda: |-
      return id(sensor_pulse_meter_total).state * 1000;
    state_class: "total_increasing"
    device_class: water

#------------------------# CT CLAMPS #------------------------#

# GPIO34 = SIG mux 1 (white/red)
  - platform: adc
    pin: GPIO34
    id: adc35
    update_interval: never
    attenuation: 12db

  - platform: template
    name: "DEBUG ADC mux1 DC"
    web_server:
      sorting_group_id: grp_mux1
    unit_of_measurement: "V"
    accuracy_decimals: 4
    update_interval: 10s
    lambda: |-
      float s = 0;
      for (int i = 0; i < 200; i++) s += id(adc35).sample();
      return s / 200.0f;

  - platform: cd74hc4067
    id: ai1
    cd74hc4067_id: cd74hc4067_shared
    number: 0
    sensor: adc35
    update_interval: 5s

  # Channel 1:
  - platform: cd74hc4067
    id: ai2
    cd74hc4067_id: cd74hc4067_shared
    number: 1
    sensor: adc35
    update_interval: 5s

  # Channel 2:  -> zit sinds 31-08-2026 fysiek op C9 (bedrading C2<->C9 gewisseld)
  - platform: cd74hc4067
    id: ai3
    cd74hc4067_id: cd74hc4067_shared
    number: 2
    sensor: adc35
    update_interval: 5s

  # Channel 3:
  - platform: cd74hc4067
    id: ai4
    cd74hc4067_id: cd74hc4067_shared
    number: 3
    sensor: adc35
    update_interval: 5s

  # Channel 4:
  - platform: cd74hc4067
    id: ai5
    cd74hc4067_id: cd74hc4067_shared
    number: 4
    sensor: adc35
    update_interval: 5s

  # Channel 5:
  - platform: cd74hc4067
    id: ai6
    cd74hc4067_id: cd74hc4067_shared
    number: 5
    sensor: adc35
    update_interval: 5s

  # Channel 6:
  - platform: cd74hc4067
    id: ai7
    cd74hc4067_id: cd74hc4067_shared
    number: 6
    sensor: adc35
    update_interval: 5s

  # Channel 7:
  - platform: cd74hc4067
    id: ai8
    cd74hc4067_id: cd74hc4067_shared
    number: 7
    sensor: adc35
    update_interval: 5s

  # Channel 8:
  - platform: cd74hc4067
    id: ai9
    cd74hc4067_id: cd74hc4067_shared
    number: 8
    sensor: adc35
    update_interval: 5s

  # Channel 9:  -> zit sinds 31-08-2026 fysiek op C2 (bedrading C2<->C9 gewisseld)
  - platform: cd74hc4067
    id: ai10
    cd74hc4067_id: cd74hc4067_shared
    number: 9
    sensor: adc35
    update_interval: 5s

  # Channel 10:
  - platform: cd74hc4067
    id: ai11
    cd74hc4067_id: cd74hc4067_shared
    number: 10
    sensor: adc35
    update_interval: 5s

  # Channel 11:
  - platform: cd74hc4067
    id: ai12
    cd74hc4067_id: cd74hc4067_shared
    number: 11
    sensor: adc35
    update_interval: 5s

  # Channel 12:
  - platform: cd74hc4067
    id: ai13
    cd74hc4067_id: cd74hc4067_shared
    number: 12
    sensor: adc35
    update_interval: 5s

  # Channel 13:
  - platform: cd74hc4067
    id: ai14
    cd74hc4067_id: cd74hc4067_shared
    number: 13
    sensor: adc35
    update_interval: 5s

  # Channel 14:
  - platform: cd74hc4067
    id: ai15
    cd74hc4067_id: cd74hc4067_shared
    number: 14
    sensor: adc35
    update_interval: 5s

  # Channel 15:
  - platform: cd74hc4067
    id: ai16
    cd74hc4067_id: cd74hc4067_shared
    number: 15
    sensor: adc35
    update_interval: 5s

  - platform: ct_clamp
    sensor: ai1
    id: RAW_ct1
    name: "RAW ct_clamp 1 (A)"
    internal: true
    web_server:
      sorting_group_id: grp_mux1
    update_interval: 5s
    sample_duration: 1000ms
    accuracy_decimals: 5
  - platform: template
    id: Measured_Current_1
    name: "Current CT 1"
    web_server:
      sorting_group_id: grp_mux1
    unit_of_measurement: "A"
    device_class: current
    update_interval: 5s
    lambda: return id(RAW_ct1).state;
    filters:
      # EERST dempen: de ruisaftrek hieronder werkt alleen op een stabiele meting.
      # Op losse samples schiet RAW regelmatig onder de ruisdrempel, en dan levert
      # de aftrek een harde 0 op terwijl er wel degelijk vermogen loopt.
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
      # DAARNA de ruisvloer kwadratisch weghalen: gemeten^2 = signaal^2 + ruis^2.
      # Lege kanalen liggen op RAW ~0.042 terwijl de curve 0.006 "nul" noemt.
      # Grote signalen verschuiven nauwelijks (accu 0.3454 -> 0.3428, <1%).
      - lambda: |-
          const float noise = 0.042f;
          return x > noise ? sqrtf(x * x - noise * noise) : 0.0f;
      - calibrate_linear:
          - 0.00600 -> 0
          - 0.10863 -> 3.448
          - 0.17766 -> 5.191
          - 0.26307 -> 8.478
      # Make everything below 0.04A appear as just 0A.
      - lambda: if (x < 0.04) return 0; else return x;
  - platform: template
    id: power1
    name: "Power CT 1"
    web_server:
      sorting_group_id: grp_mux1
    lambda: return id(Measured_Current_1).state * 230;
    device_class: power
    unit_of_measurement: 'W'
    update_interval: 5s
    state_class: measurement

  - platform: ct_clamp
    sensor: ai2
    id: RAW_ct2
    name: "RAW ct_clamp 2 (A)"
    internal: true
    web_server:
      sorting_group_id: grp_mux1
    update_interval: 5s
    sample_duration: 1000ms
    accuracy_decimals: 5
  - platform: template
    id: Measured_Current_2
    name: "Current CT 2"
    web_server:
      sorting_group_id: grp_mux1
    unit_of_measurement: "A"
    device_class: current
    update_interval: 5s
    lambda: return id(RAW_ct2).state;
    filters:
      # EERST dempen: de ruisaftrek hieronder werkt alleen op een stabiele meting.
      # Op losse samples schiet RAW regelmatig onder de ruisdrempel, en dan levert
      # de aftrek een harde 0 op terwijl er wel degelijk vermogen loopt.
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
      # DAARNA de ruisvloer kwadratisch weghalen: gemeten^2 = signaal^2 + ruis^2.
      # Lege kanalen liggen op RAW ~0.042 terwijl de curve 0.006 "nul" noemt.
      # Grote signalen verschuiven nauwelijks (accu 0.3454 -> 0.3428, <1%).
