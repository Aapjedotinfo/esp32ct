# ---- P1-uitgang: elke seconde een DSMR 5-telegram naar de Alfen ----
# 26-10-2026. De velden zijn de number-entities "P1 Out ..." hierboven; vermogen
# per fase met teken (negatief = export). Spanning komt van de echte P1-ingang
# van dit bord als die geldig is, anders de reservewaarde. Stroom wordt
# berekend. De kWh-tellers lopen mee met het vermogen (dal/normaal volgens het
# tarief) en worden elke 10 min in de number-entities bewaard. CRC-16/ARC
# (poly 0xA001 gespiegeld, init 0) over alles van '/' tot en met '!'.
# Zenden alleen als switch "P1 Out Aan" aan staat (na een reboot komt hij terug in de laatst gekozen stand).
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(p1o_acc_init)) {
            id(p1o_acc)[0] = id(p1o_kwh_in1).state;
            id(p1o_acc)[1] = id(p1o_kwh_in2).state;
            id(p1o_acc)[2] = id(p1o_kwh_out1).state;
            id(p1o_acc)[3] = id(p1o_kwh_out2).state;
            id(p1o_acc_init) = true;
          }
          if (!id(p1o_aan).state) {
            id(p1o_wasactief) = false;
            return;
          }
          auto pos = [](float x) { return x > 0 ? x : 0.0f; };
          float w[3] = {id(p1o_w_l1).state, id(p1o_w_l2).state, id(p1o_w_l3).state};
          float vres[3] = {id(p1o_v_l1).state, id(p1o_v_l2).state, id(p1o_v_l3).state};
          float v[3];
          v[0] = (id(p1_v_l1).has_state() && id(p1_v_l1).state > 100) ? id(p1_v_l1).state : vres[0];
          v[1] = (id(p1_v_l2).has_state() && id(p1_v_l2).state > 100) ? id(p1_v_l2).state : vres[1];
          v[2] = (id(p1_v_l3).has_state() && id(p1_v_l3).state > 100) ? id(p1_v_l3).state : vres[2];
          float win[3], wout[3];
          for (int i = 0; i < 3; i++) {
            win[i] = pos(w[i]);
            wout[i] = pos(-w[i]);
          }
          // kWh meetellen
          int tar = ((int) id(p1o_tariff).state == 1) ? 0 : 1;
          id(p1o_acc)[tar] += (win[0] + win[1] + win[2]) / 3600000.0;
          id(p1o_acc)[2 + tar] += (wout[0] + wout[1] + wout[2]) / 3600000.0;
          if (millis() - id(p1o_acc_save) > 600000) {
            id(p1o_acc_save) = millis();
            id(p1o_kwh_in1).make_call().set_value(id(p1o_acc)[0]).perform();
            id(p1o_kwh_in2).make_call().set_value(id(p1o_acc)[1]).perform();
            id(p1o_kwh_out1).make_call().set_value(id(p1o_acc)[2]).perform();
            id(p1o_kwh_out2).make_call().set_value(id(p1o_acc)[3]).perform();
          }
          char b[96];
          std::string t;
          t.reserve(1024);
          t += "/ESP5\\2ESP32CT\r\n\r\n";
          t += "1-3:0.2.8(50)\r\n";
          auto now = id(homeassistant_time).now();
          if (now.is_valid()) {
            time_t ts = now.timestamp;
            struct tm lt;
            localtime_r(&ts, &lt);
            snprintf(b, sizeof(b), "0-0:1.0.0(%02d%02d%02d%02d%02d%02d%c)\r\n", lt.tm_year % 100, lt.tm_mon + 1,
                     lt.tm_mday, lt.tm_hour, lt.tm_min, lt.tm_sec, lt.tm_isdst > 0 ? 'S' : 'W');
          } else {
            snprintf(b, sizeof(b), "0-0:1.0.0(000101000000W)\r\n");
          }
          t += b;
          t += "0-0:96.1.1(4530303034303030303030303030303030)\r\n";
          static const char *kwh[4] = {"1-0:1.8.1", "1-0:1.8.2", "1-0:2.8.1", "1-0:2.8.2"};
          for (int i = 0; i < 4; i++) {
            snprintf(b, sizeof(b), "%s(%010.3f*kWh)\r\n", kwh[i], (float) id(p1o_acc)[i]);
            t += b;
          }
          snprintf(b, sizeof(b), "0-0:96.14.0(%04d)\r\n", tar + 1);
          t += b;
          snprintf(b, sizeof(b), "1-0:1.7.0(%06.3f*kW)\r\n1-0:2.7.0(%06.3f*kW)\r\n",
                   (win[0] + win[1] + win[2]) / 1000.0f, (wout[0] + wout[1] + wout[2]) / 1000.0f);
          t += b;
          static const char *pin[3] = {"1-0:21.7.0", "1-0:41.7.0", "1-0:61.7.0"};
          static const char *pout[3] = {"1-0:22.7.0", "1-0:42.7.0", "1-0:62.7.0"};
          static const char *volt[3] = {"1-0:32.7.0", "1-0:52.7.0", "1-0:72.7.0"};
          static const char *amp[3] = {"1-0:31.7.0", "1-0:51.7.0", "1-0:71.7.0"};
          for (int i = 0; i < 3; i++) {
            snprintf(b, sizeof(b), "%s(%06.3f*kW)\r\n", pin[i], win[i] / 1000.0f);
            t += b;
            snprintf(b, sizeof(b), "%s(%06.3f*kW)\r\n", pout[i], wout[i] / 1000.0f);
            t += b;
          }
          for (int i = 0; i < 3; i++) {
            snprintf(b, sizeof(b), "%s(%05.1f*V)\r\n", volt[i], v[i]);
            t += b;
            float a = (win[i] + wout[i]) / v[i];
            snprintf(b, sizeof(b), "%s(%03d*A)\r\n", amp[i], (int) (a + 0.5f));
            t += b;
          }
          t += "!";
          uint16_t crc = 0;
          for (unsigned char c : t) {
            crc ^= c;
            for (int k = 0; k < 8; k++)
              crc = (crc & 1) ? (crc >> 1) ^ 0xA001 : (crc >> 1);
          }
          snprintf(b, sizeof(b), "%04X\r\n", crc);
          t += b;
          id(uart_p1out).write_str(t.c_str());
          if (!id(p1o_wasactief)) {
            id(p1o_wasactief) = true;
            ESP_LOGI("p1out", "zenden gestart, telegram:\n%s", t.c_str());
          }
