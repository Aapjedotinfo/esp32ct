      # Op losse samples schiet RAW regelmatig onder de ruisdrempel, en dan levert
      # de aftrek een harde 0 op terwijl er wel degelijk vermogen loopt.
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
      # DAARNA de ruisvloer kwadratisch weghalen: gemeten^2 = signaal^2 + ruis^2.
      # Lege kanalen liggen op RAW ~0.042 terwijl de curve 0.006 "nul" noemt.
      # Grote signalen verschuiven nauwelijks (accu 0.3454 -> 0.3428, <1%).
      - lambda: |-
          const float noise = 0.042f;
          return x > noise ? sqrtf(x * x - noise * noise) : 0.0f;
      - calibrate_linear:
          - 0.00600 -> 0
          - 0.10863 -> 3.448
          - 0.17766 -> 5.191
          - 0.26307 -> 8.478
      # Make everything below 0.04A appear as just 0A.
      - lambda: if (x < 0.04) return 0; else return x;
  - platform: template
    id: power15
    name: "Power CT 15"
    web_server:
      sorting_group_id: grp_mux1
    # Negative on purpose: this circuit only ever carries PV generation, and a CT
    # clamp cannot sense direction. Flipping the sign makes it read as production
    # (energy flowing into the house) instead of consumption.
    lambda: return id(Measured_Current_15).state * -230;
    device_class: power
    unit_of_measurement: 'W'
    update_interval: 5s
    state_class: measurement

  - platform: ct_clamp
    sensor: ai16
    id: RAW_ct16
    name: "RAW ct_clamp 16 (A)"
    internal: true
    web_server:
      sorting_group_id: grp_mux1
    update_interval: 5s
    sample_duration: 1000ms
    accuracy_decimals: 5
  - platform: template
    id: Measured_Current_16
    name: "Current CT 16"
    web_server:
      sorting_group_id: grp_mux1
    unit_of_measurement: "A"
    device_class: current
    update_interval: 5s
    lambda: return id(RAW_ct16).state;
    filters:
      # EERST dempen: de ruisaftrek hieronder werkt alleen op een stabiele meting.
      # Op losse samples schiet RAW regelmatig onder de ruisdrempel, en dan levert
      # de aftrek een harde 0 op terwijl er wel degelijk vermogen loopt.
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
      # DAARNA de ruisvloer kwadratisch weghalen: gemeten^2 = signaal^2 + ruis^2.
      # Lege kanalen liggen op RAW ~0.042 terwijl de curve 0.006 "nul" noemt.
      # Grote signalen verschuiven nauwelijks (accu 0.3454 -> 0.3428, <1%).
      - lambda: |-
          const float noise = 0.042f;
          return x > noise ? sqrtf(x * x - noise * noise) : 0.0f;
      - calibrate_linear:
          - 0.00600 -> 0
          - 0.10863 -> 3.448
          - 0.17766 -> 5.191
          - 0.26307 -> 8.478
      # Make everything below 0.04A appear as just 0A.
      - lambda: if (x < 0.04) return 0; else return x;
  - platform: template
    id: power16
    name: "Power CT 16"
    web_server:
      sorting_group_id: grp_mux1
    lambda: return id(Measured_Current_16).state * 230;
    device_class: power
    unit_of_measurement: 'W'
    update_interval: 5s
    state_class: measurement

  # ---- Laadpaal: één kWh-teller over de drie fases ----
  # 31-08-2026: de per-kanaal kWh-tellers zijn eruit; alleen de laadpaal
  # houdt nog een teller, en dan als één getal over L1+L2+L3 samen.
  - platform: template
    id: laadpaal_w_totaal
    name: "Power CT 3+4+5 (example group total)"
    web_server:
      sorting_group_id: grp_mux1
    lambda: |-
      return ( id(Measured_Current_3).state
             + id(Measured_Current_4).state
             + id(Measured_Current_5).state ) * 230;
    device_class: power
    unit_of_measurement: 'W'
    update_interval: 5s
    state_class: measurement

  - platform: total_daily_energy
    id: tde_laadpaal
    name: "Energy CT 3+4+5 (example group total)"
    power_id: laadpaal_w_totaal
    web_server:
      sorting_group_id: grp_mux1
    filters:
        - multiply: 0.001
    unit_of_measurement: kWh
    accuracy_decimals: 3
    icon: mdi:lightning-bolt
    device_class: energy


switch:
  - platform: gpio
    pin:
      number: GPIO33   # moved from GPIO27 (now S3 of the mux)
      inverted: true   # rev C: relaisbordje is actief-laag
    restore_mode: ALWAYS_OFF
    name: "Doorbell Relay Huis"
    web_server:
      sorting_group_id: grp_doorbell
    id: relay_housebell
    icon: mdi:alarm-bell

  - platform: gpio
    pin:
      number: GPIO25
      inverted: true   # rev C: relaisbordje is actief-laag
    restore_mode: ALWAYS_OFF
    name: "Doorbell Relay Garage"
    web_server:
      sorting_group_id: grp_doorbell
    id: relay_garagebell
    icon: mdi:alarm-bell

  # Kill-switch voor de nagebootste P1-uitgang naar de Alfen.
  - platform: template
    name: "P1 Out Aan"
    id: p1o_aan
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:transmission-tower-export

  - platform: template
    name: Doorbell Garage Muted
    web_server:
      sorting_group_id: grp_doorbell
    id: garage_active
    turn_on_action:
      - globals.set:
          id: garage
          value: 'true'
    turn_off_action:
      - globals.set:
          id: garage
          value: 'false'
    lambda: |-
      return id(garage);

  - platform: template
    name: Doorbell House Muted
    web_server:
      sorting_group_id: grp_doorbell
    id: house_active
    turn_on_action:
      - globals.set:
          id: house
          value: 'true'
    turn_off_action:
      - globals.set:
          id: house
          value: 'false'
    lambda: |-
      return id(house);

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO26
      mode: INPUT_PULLUP
      inverted: true
    name: "Doorbell"
    web_server:
      sorting_group_id: grp_doorbell
    filters:
      # Small filter, to debounce the button press.
      - delayed_on: 25ms
      - delayed_off: 25ms
    on_press:
      then:
      # Only turn on the house when it is active.
      - if:
          condition:
            - switch.is_off: garage_active
          then:
            - switch.turn_on: relay_garagebell
      - if:
          condition:
            - switch.is_off: house_active
          then:
            - switch.turn_on: relay_housebell

    on_release:
      # On release, turn of the house/garage bell.
      - switch.turn_off: relay_garagebell
      - delay: 50ms
      - switch.turn_off: relay_housebell

  - platform: gpio
    id: water_sensor_status
    name: "Water sensor status"
    web_server:
      sorting_group_id: grp_water
    internal: false
    use_interrupt: false
    pin:
      number: GPIO32
      inverted: true
      mode:
        input: true
        pullup: true
      allow_other_uses: true
    on_press:
      - lambda: |-
          id(total_water_pulses) += 1;

